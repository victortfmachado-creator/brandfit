<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BrandFit · Inteligência de Marca no PDV</title>
<style>
:root{--bg:#111214;--bg2:#191b1e;--card:#202327;--card2:#26292e;--line:#31353b;--txt:#e8eaed;--txt2:#9aa0a6;--txt3:#6b7075;--red:#e02020;--red2:#ff5252;--red-dim:rgba(224,32,32,.14);--ok:#31b46b;--warn:#e8a13c;--bad:#e05050;--info:#4c9be8;--radius:14px;--radius-sm:10px;--tabnum:"tnum","tabular-nums"}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;min-height:100vh;padding-bottom:90px}
button{font-family:inherit;font-variant-numeric:inherit}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--txt);background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;width:100%;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red)}
label{display:block;font-size:.78rem;color:var(--txt2);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
h1,h2,h3{font-weight:700}
a{color:var(--red2)}
.appbar{position:sticky;top:0;z-index:50;background:rgba(17,18,20,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px 0}
.appbar .row1{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;flex:none}
.appbar h1{font-size:1.05rem;letter-spacing:.3px}
.appbar .sub{font-size:.7rem;color:var(--txt3)}
.badge-mock{margin-left:auto;background:var(--warn);color:#1a1a1a;font-size:.62rem;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.5px;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:76px;background:none;border:none;color:var(--txt2);padding:9px 6px 11px;font-size:.78rem;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tab.active{color:var(--txt);border-bottom-color:var(--red)}
.tab .ic{display:block;font-size:1.05rem;margin-bottom:2px}
.page{padding:14px;max-width:1180px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h3{font-size:.95rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .hint{font-size:.68rem;color:var(--txt3);font-weight:400;margin-left:auto;text-align:right}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
.muted{color:var(--txt2)}.small{font-size:.78rem}.tiny{font-size:.68rem;color:var(--txt3)}
.mid{font-size:1.15rem;font-weight:700;font-variant-numeric:var(--tabnum)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px;font-size:.85rem;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.fab{position:fixed;right:16px;bottom:86px;width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:1.6rem;box-shadow:0 6px 20px rgba(224,32,32,.4);cursor:pointer;z-index:40}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);color:var(--txt2);border-radius:20px;padding:3px 10px;font-size:.7rem;font-weight:600;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(49,180,107,.35)}
.chip.info{color:var(--info);border-color:rgba(76,155,232,.35)}
.badge{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--card2);color:var(--txt3);border:1px solid var(--line)}
.badge.coletado{color:var(--ok);border-color:rgba(49,180,107,.4)}
.badge.estimado{color:var(--warn);border-color:rgba(232,161,60,.4)}
.badge.mock{color:var(--info);border-color:rgba(76,155,232,.4)}
.badge.estimativa{color:var(--warn);border-color:rgba(232,161,60,.4)}
.bar{height:8px;background:var(--bg2);border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:var(--red);border-radius:6px;transition:width .3s}
.bar.ok>div{background:var(--ok)}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;cursor:pointer}
.kpi .v{font-size:1.3rem;font-weight:800;font-variant-numeric:var(--tabnum)}
.kpi .l{font-size:.66rem;color:var(--txt2);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.kpi .m{font-size:.66rem;color:var(--txt3);margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{color:var(--txt2);font-size:.66rem;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:var(--tabnum)}
tr:last-child td{border-bottom:none}
.t-right{text-align:right}
.semaforo{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.semaforo.g{background:var(--ok)}.semaforo.y{background:var(--warn)}.semaforo.r{background:var(--bad)}
.progress-pill{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:12px}
.progress-pill.p{background:var(--red-dim);color:var(--red2)}
.progress-pill.e{background:rgba(76,155,232,.15);color:var(--info)}
.progress-pill.c{background:rgba(49,180,107,.15);color:var(--ok)}
.visita{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.visita .head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.visita .n{width:30px;height:30px;flex:none;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:var(--txt2)}
.visita.done .n{background:rgba(49,180,107,.15);border-color:rgba(49,180,107,.4);color:var(--ok)}
.visita .nome{font-weight:700;font-size:.92rem}
.visita .meta{font-size:.7rem;color:var(--txt3);margin-top:1px}
.visita .body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.visita.open .body{display:block}
.acao-dia{background:var(--red-dim);border:1px solid rgba(224,32,32,.35);border-radius:var(--radius-sm);padding:10px 12px;margin:10px 0}
.acao-dia .t{font-size:.66rem;font-weight:800;color:var(--red2);text-transform:uppercase;letter-spacing:.6px}
.acao-dia .a{font-size:.88rem;font-weight:600;margin:3px 0}
.acao-dia .j{font-size:.7rem;color:var(--txt2)}
.visita .acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.visita .acts .btn{padding:9px 4px;font-size:.72rem;min-height:42px}
.handle{cursor:grab;color:var(--txt3);font-size:1rem;padding:4px 2px;user-select:none}
.escada{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.degrau{display:flex;align-items:center;gap:8px}
.degrau .r{height:22px;border-radius:5px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;padding:0 8px;font-size:.68rem;font-weight:700;white-space:nowrap}
.degrau .nm{font-size:.7rem;color:var(--txt2);width:110px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.degrau.foco .r{background:var(--red-dim);border-color:var(--red);color:var(--red2)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#2a2d32;color:var(--txt);border:1px solid var(--line);border-left:4px solid var(--ok);padding:11px 18px;border-radius:10px;font-size:.82rem;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-left-color:var(--bad)}
#toast.warn{border-left-color:var(--warn)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:18px 16px 24px}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:18px}}
.modal h3{margin-bottom:12px}
.skeleton{background:linear-gradient(90deg,var(--card2) 25%,#2e3238 50%,var(--card2) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{text-align:center;padding:36px 16px;color:var(--txt2)}
.empty .ic{font-size:2rem;margin-bottom:8px}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none;padding-bottom:2px}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:none;background:var(--card);border:1px solid var(--line);color:var(--txt2);border-radius:20px;padding:8px 14px;font-size:.76rem;font-weight:600;cursor:pointer;white-space:nowrap}
.subtab.active{background:var(--red);border-color:var(--red);color:#fff}
.aviso{background:rgba(232,161,60,.1);border:1px solid rgba(232,161,60,.35);border-radius:var(--radius-sm);padding:9px 12px;font-size:.74rem;color:var(--warn);margin:8px 0}
.aviso.red{background:var(--red-dim);border-color:rgba(224,32,32,.4);color:var(--red2)}
.veredito{background:var(--card2);border-left:4px solid var(--red);border-radius:var(--radius-sm);padding:12px 14px;font-size:.84rem;line-height:1.5}
.veredito .v-title{font-weight:800;color:var(--red2);margin-bottom:4px}
textarea{min-height:70px;resize:vertical}
.copyarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px;font-size:.76rem;color:var(--txt2);white-space:pre-wrap;font-variant-numeric:var(--tabnum)}
.escada-leg{font-size:.66rem;color:var(--txt3);margin-top:4px}
.filtro-linha{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.filtro-linha select{width:auto;min-width:130px;flex:1}
.sticky-top{position:sticky;top:96px;z-index:10;margin:-4px -14px 12px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
</style>
</head>
<body>

<header class="appbar">
  <div class="row1">
    <svg class="logo" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="#e02020" stroke-width="3"/><path d="M16 8 v8 l6 4" stroke="#e02020" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
    <div><h1>BrandFit</h1><div class="sub" id="subtitulo">Inteligência de marca no PDV</div></div>
    <span class="badge-mock" id="badge-mock">DADOS FICTÍCIOS</span>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="hoje"><span class="ic">📍</span>Hoje · Rep</button>
    <button class="tab" data-tab="pdv"><span class="ic">🏪</span>PDV · Campo</button>
    <button class="tab" data-tab="territorio"><span class="ic">🗺️</span>Território · Gestão</button>
    <button class="tab" data-tab="visoes"><span class="ic">👓</span>Visões · Áreas</button>
    <button class="tab" data-tab="config"><span class="ic">⚙️</span>Config · Motor</button>
  </nav>
</header>

<main class="page" id="conteudo"></main>

<button class="fab" id="fab" title="Registro rápido de visita">＋</button>

<div id="toast"></div>
<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>

<script src="app.js"></script>
<script src="ui1.js"></script>
<script src="ui2.js"></script>
<script src="v2.js"></script>
<script src="v2ui.js"></script>
<script src="v3.js"></script>
<script src="v3ui.js"></script>
<script src="v4.js"></script>
<script src="v4ui.js"></script>
<script src="v5.js"></script>
<script src="v5ui.js"></script>
<script src="v6.js"></script>
<script src="v6ui.js"></script>
<script src="v7.js"></script>
<script src="v7ui.js"></script>
</body>
</html>
